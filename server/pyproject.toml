[project]
name = "agent-server"
version = "2.4.0"
description = "FastAPI backend for AgentPilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "claude-agent-sdk",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "httpx-s3-client",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "python-multipart>=0.0.20",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
    "wsproto>=1.3.2",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.30.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    # Pinned exactly: ruff adds rules in minors and occasionally tightens one in
    # a patch release, and the CI lint gate must only ever fail on our own code,
    # never on a resolver picking up a sharper linter overnight.
    "ruff==0.17.3",
]

# Audit remediation 2026-10-26: FastAPI dependency markers are the documented
# dependency-injection pattern; B008 (function call in default argument) is a
# false positive for them. Every other rule keeps the current behaviour.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.UploadFile",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
httpx-s3-client = { git = "https://github.com/t4wefan/httpx-s3-client.git" }
