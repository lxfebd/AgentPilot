name: agent-pilot

services:
  postgres-next:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_pilot
      POSTGRES_USER: agent_pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_pilot_dev_password}
    volumes:
      - agent-pilot-pg-next:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_pilot -d agent_pilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-next:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - agent-pilot-redis-next:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate-next:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server
    image: agent-pilot-server:postgres
    depends_on:
      postgres-next:
        condition: service_healthy
    environment:
      AGENT_SERVER_DB_BACKEND: postgres
      AGENT_SERVER_DB_URL: postgresql+asyncpg://agent_pilot:${POSTGRES_PASSWORD:-agent_pilot_dev_password}@postgres-next:5432/agent_pilot
      AGENT_SERVER_MIGRATION_LOCK_TIMEOUT: ${AGENT_SERVER_MIGRATION_LOCK_TIMEOUT:-120}
    command: ["sh", "-c", "cd /app/server && uv run --no-sync python -m agent_server.infra.db.migrations upgrade"]

  server-next:
    image: agent-pilot-server:postgres
    restart: unless-stopped
    depends_on:
      migrate-next:
        condition: service_completed_successfully
      redis-next:
        condition: service_healthy
    environment:
      AGENT_SERVER_DB_BACKEND: postgres
      AGENT_SERVER_DB_URL: postgresql+asyncpg://agent_pilot:${POSTGRES_PASSWORD:-agent_pilot_dev_password}@postgres-next:5432/agent_pilot
      AGENT_SERVER_DB_POOL_SIZE: ${AGENT_SERVER_DB_POOL_SIZE:-10}
      AGENT_SERVER_DB_MAX_OVERFLOW: ${AGENT_SERVER_DB_MAX_OVERFLOW:-20}
      AGENT_SERVER_DB_POOL_TIMEOUT: ${AGENT_SERVER_DB_POOL_TIMEOUT:-30}
      AGENT_SERVER_DB_POOL_RECYCLE: ${AGENT_SERVER_DB_POOL_RECYCLE:-1800}
      AGENT_SERVER_REDIS_URL: redis://redis-next:6379/0
      # Every Redis key is namespaced by this prefix: connector presence,
      # runtime leases and timeline locks.  Changing it on a running deployment
      # moves all of them at once, so it is pinned here instead of inherited
      # from a code default that a release may rename.
      AGENT_SERVER_REDIS_PREFIX: ${AGENT_SERVER_REDIS_PREFIX:-agent-pilot}
      AGENT_SERVER_REDIS_CONNECT_TIMEOUT: ${AGENT_SERVER_REDIS_CONNECT_TIMEOUT:-5}
      AGENT_SERVER_TIMELINE_REVISION_LEASE_SIZE: ${AGENT_SERVER_TIMELINE_REVISION_LEASE_SIZE:-4096}
      AGENT_SERVER_FILES_BACKEND: local
      AGENT_SERVER_FILES_LOCAL_ROOT: /data/agent-server.files
      AGENT_SERVER_SECRET: ${AGENT_SERVER_SECRET:-change-me-before-production}
      AGENT_SERVER_PUBLIC_ORIGIN: ${AGENT_SERVER_PUBLIC_ORIGIN:-}
      AGENT_SERVER_CORS_ORIGINS: ${AGENT_SERVER_CORS_ORIGINS:-http://127.0.0.1:${AGENT_PILOT_WEB_PORT:-5174},http://localhost:${AGENT_PILOT_WEB_PORT:-5174}}
    volumes:
      - agent-pilot-files-next:/data
    ports:
      - "${AGENT_PILOT_WEB_PORT:-5174}:8000"

volumes:
  agent-pilot-pg-next:
  agent-pilot-redis-next:
  agent-pilot-files-next:
