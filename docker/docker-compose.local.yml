name: agent-pilot-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_pilot
      POSTGRES_USER: agent_pilot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent_pilot_dev_password}"
    ports:
      - "127.0.0.1:${AGENT_PILOT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_pilot -d agent_pilot"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${AGENT_PILOT_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
