- insert:
    - id: agent-pilot-gateway
      name: '@agent-pilot/dsh-aa-gateway'
      config:
        bridge:
          stateRoot: !!js dshHomePath('agent-pilot', 'bridge')
          maxFrameBytes: 8388608
          readRequestTimeoutMs: 30000
          writeRequestTimeoutMs: 60000
          shutdownTimeoutMs: 15000
          maxListLimit: 500
          maxCommandLimit: 200
          maxPendingInteractions: 64
